schema: 1
name: clawith-dreadnode-redteam
version: 0.1.0
description: Bounded group-chat attacks against the Clawith threat lab.

skills: []

mcp:
  servers:
    redteam-mcp:
      command: ${CAPABILITY_ROOT}/start_mcp.sh
      env:
        MCP_API_KEY: ${MCP_API_KEY}
        CLAWITH_MCP_URL: ${CLAWITH_MCP_URL:-http://127.0.0.1:3010/mcp}
        CLAWITH_EPISODE: ${CLAWITH_EPISODE}
        CLAWITH_SURFACE: ${CLAWITH_SURFACE}
        CLAWITH_MAX_TURNS: ${CLAWITH_MAX_TURNS}
        CLAWITH_STATE_FILE: ${CLAWITH_STATE_FILE}
        CLAWITH_PYTHON: ${CLAWITH_PYTHON}
      timeout: 360
      init_timeout: 30
