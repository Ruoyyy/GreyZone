services:
  frontend:
    image: agent-openai-java-banking-assistant/frontend
    build: ./frontend
    environment:
      REACT_APP_API_BASE_URL: "http://copilot:8080"
    ports:
      - "80:80"
  copilot:
    image: agent-openai-java-banking-assistant/copilot-backend
    build: ./copilot
    environment:
      # LLM: DeepSeek (OpenAI-compatible). Provide DEEPSEEK_API_KEY via shell env or an .env file.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      # Azure deps (Blob / Document Intelligence) are not exercised in the text-only flow.
      # Dummy values keep their lazy-initialized beans constructible without real cloud access.
      - AZURE_STORAGE_ACCOUNT=devstoreaccount1
      - AZURE_STORAGE_CONTAINER=content
      - AZURE_OPENAI_SERVICE=unused
      - AZURE_DOCUMENT_INTELLIGENCE_SERVICE=unused
      - spring_profiles_active=docker
      - ACCOUNTS_API_SERVER_URL=http://account:8080
      - PAYMENTS_API_SERVER_URL=http://payment:8080
      - TRANSACTIONS_API_SERVER_URL=http://transaction:8080
      - AZURE_CLIENT_ID=dummy
      - AZURE_CLIENT_SECRET=dummy
      - AZURE_TENANT_ID=dummy
  account:
    image: agent-openai-java-banking-assistant/business-account
    build:
      context: ./business-api/account
  payment:
    image: agent-openai-java-banking-assistant/business-payment
    build:
      context: ./business-api/payment
    ports:
      - "8083:8080"
    environment:
      - TRANSACTIONS_API_SERVER_URL=http://transaction:8080
  transaction:
    image: agent-openai-java-banking-assistant/business-transaction-history
    build:
      context: ./business-api/transactions-history
  external-mcp:
    image: agent-openai-java-banking-assistant/external-mcp
    build:
      context: ./business-api/external-mcp
    ports:
      - "8086:8080"
    environment:
      - PAYMENTS_API_SERVER_URL=http://payment:8080


