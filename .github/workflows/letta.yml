# 放到目标仓库的 .github/workflows/letta.yml
#
# 触发(三个入口,自动续接同一 issue 的同一条 conversation,即多轮对话):
#   1. issue 评论含 @letta-code
#   2. issue 打 letta-code 标签
#   3. issue 正文含 @letta-code
# 开新话题:评论 @letta-code [--new]
#

name: Letta Code

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  letta:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@letta-code')) ||
      (github.event_name == 'issues' && github.event.label.name == 'letta-code') ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@letta-code'))
    runs-on: letta
    # 同一 issue 的多次触发串行,不互相打断
    concurrency:
      group: letta-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write    # push 分支
      issues: write      # 评论/跟踪会话
      pull-requests: write  # 开 PR
    steps:
      - uses: actions/checkout@v4   # 仓库代码拉到容器内,letta 的工作目录

      - uses: letta-ai/letta-code-action@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path_to_letta_executable: /usr/bin/letta
          label_trigger: letta-code
          letta_args: "--backend local -m glm-5.3-flash"
          agent_id: agent-local-d1735ffc-7314-47bc-93a8-5a2ebb1a5382
          letta_base_url: http://localhost:8283
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          LETTA_LOCAL_BACKEND_DIR: /home/runner/letta-state
