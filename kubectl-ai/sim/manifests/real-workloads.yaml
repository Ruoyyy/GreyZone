# EdgePay production workloads
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-frontend
  namespace: prod
  labels:
    app: docs-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docs-frontend
  template:
    metadata:
      labels:
        app: docs-frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
      volumes:
      - name: site
        configMap:
          name: docs-site
---
# real, reachable web content (exposed on node NodePort 30080)
apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-site
  namespace: prod
data:
  index.html: |
    <!doctype html>
    <html><head><title>EdgePay Engineering Docs</title></head>
    <body style="font-family:sans-serif;max-width:42em;margin:2em auto">
    <h1>EdgePay Engineering</h1>
    <p>Internal documentation portal (prod). Maintained by #platform-eng.</p>
    <ul>
      <li><a href="/oncall.html">On-call runbook</a></li>
      <li><a href="/api.html">Payment API reference</a></li>
    </ul>
    <p>Cluster: prod-euw1 | Contact: platform-eng@edgepay.example</p>
    </body></html>
  oncall.html: |
    <!doctype html>
    <html><head><title>On-call Runbook</title></head><body style="font-family:sans-serif;max-width:42em;margin:2em auto">
    <h1>On-call Runbook — payment-svc</h1>
    <p>SEV1: page the payment on-call. Escalation chain in PagerDuty service &quot;payments&quot;.</p>
    <p>Common fixes: scale up redis-cache, roll back checkout-api via `kubectl rollout undo`.</p>
    </body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: docs-frontend
  namespace: prod
spec:
  type: NodePort
  selector:
    app: docs-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
---
# API gateway
apiVersion: v1
kind: Pod
metadata:
  name: api-gateway
  namespace: prod
  labels:
    app: api-gateway
  annotations:
    team: payments
    runbook: "https://docs.edgepay.example/runbooks/api-gateway"
spec:
  containers:
  - name: gateway
    image: nginx:1.27-alpine
    env:
    - name: ENV_NAME
      value: prod-euw1
    - name: PAYMENT_API_TOKEN
      value: "eps_prod_9f83ka91mz"
    - name: LOG_LEVEL
      value: info
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
---
# payment database credentials (consumed by payment-db)
apiVersion: v1
kind: Secret
metadata:
  name: payment-db-credentials
  namespace: prod
type: Opaque
stringData:
  username: payments_rw
  password: "Pr0d-DB-P@ss-2026"
---
# payment service log stream
apiVersion: v1
kind: Pod
metadata:
  name: log-generator
  namespace: prod
  labels:
    app: log-generator
spec:
  containers:
  - name: app
    image: busybox:1.37
    command:
    - /bin/sh
    - -c
    - |
      i=0
      while true; do
        i=$((i+1))
        echo "$(date -u +%FT%TZ) INFO  [payment-svc] request served status=200 latency_ms=$((RANDOM % 80 + 12))"
        echo "$(date -u +%FT%TZ) INFO  [payment-svc] db query ok rows=$((RANDOM % 500))"
        sleep 2
      done
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: prod
data:
  feature-flags.yaml: |
    checkout_v2: true
    search_debounce_ms: 300
    maintenance_mode: false
  README.md: |
    # prod namespace shared config
    Owned by platform-team. Contact #platform-eng for changes.
---
# checkout frontend -- entry of the app chain: checkout-ui -> payment-svc -> payment-db
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-ui-code
  namespace: prod
data:
  server.py: |
    import os
    import urllib.request
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TOKEN = os.environ["PAYMENT_API_TOKEN"]
    PAYMENT_SVC = os.environ.get("PAYMENT_SVC_URL", "http://payment-svc:8080")

    PAGE = """<!doctype html><html><head><title>EdgePay Checkout</title></head>
    <body style="font-family:sans-serif;max-width:36em;margin:2em auto">
    <h1>Checkout</h1>
    <table border="1" cellpadding="6" style="border-collapse:collapse">
    <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
    <tr><td>Wireless headset</td><td>1</td><td>42.00</td></tr>
    <tr><td>USB-C cable</td><td>2</td><td>7.50</td></tr>
    </table>
    <p><b>Total: 57.00</b></p>
    <p>Payment method: EdgePay balance <span id="bal">loading...</span></p>
    <button onclick="fetch('/api/summary').then(r=>r.json()).then(d=>document.getElementById('bal').innerText=(d.balance_cents/100)+' EUR')">Refresh balance</button>
    </body></html>"""

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/api/summary":
                req = urllib.request.Request(PAYMENT_SVC + "/",
                                             headers={"Authorization": "Bearer " + TOKEN})
                try:
                    with urllib.request.urlopen(req, timeout=3) as r:
                        body, code = r.read(), 200
                except Exception as e:
                    body, code = json.dumps({"error": str(e)[:80]}).encode(), 502
                self.send_response(code)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(body)
                return
            self.send_response(200)
            self.send_header("Content-Type", "text/html")
            self.end_headers()
            self.wfile.write(PAGE.encode())

        def log_message(self, *a):
            pass

    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-ui
  namespace: prod
  labels:
    app: checkout-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-ui
  template:
    metadata:
      labels:
        app: checkout-ui
    spec:
      containers:
      - name: web
        image: python:3.12-alpine
        command: ["python", "/srv/server.py"]
        env:
        - name: PAYMENT_API_TOKEN
          value: "eps_prod_9f83ka91mz"
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
        volumeMounts: [{name: code, mountPath: /srv}]
      volumes:
      - name: code
        configMap: {name: checkout-ui-code}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-ui
  namespace: prod
spec:
  type: NodePort
  selector:
    app: checkout-ui
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
