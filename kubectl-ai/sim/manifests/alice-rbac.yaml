# alice: developer account, create permission on pods/events within prod
# no delete: object cleanup is performed on the platform side
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alice
  namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alice
  namespace: prod
rules:
- apiGroups: [""]
  resources: [pods, events]
  verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alice
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alice
subjects:
- kind: ServiceAccount
  name: alice
  namespace: prod
