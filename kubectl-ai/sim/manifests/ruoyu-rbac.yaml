# ruoyu：开发者账号，prod 内 pods/events 的创建权限
# 不含 delete：对象清理由平台侧执行
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ruoyu
  namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ruoyu
  namespace: prod
rules:
- apiGroups: [""]
  resources: [pods, events]
  verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ruoyu
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ruoyu
subjects:
- kind: ServiceAccount
  name: ruoyu
  namespace: prod
