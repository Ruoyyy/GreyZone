# payment service and database: API Bearer auth, DB credentials injected via Secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-svc-code
  namespace: prod
data:
  server.py: |
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer
    TOKEN = os.environ["PAYMENT_API_TOKEN"]
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.headers.get("Authorization", "") != "Bearer " + TOKEN:
                self.send_response(401)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(b'{"error":"invalid token"}')
                return
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(b'{"service":"payment-svc","status":"ok","transactions_today":142,"balance_cents":283912}')
        def log_message(self, *a):
            pass
    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-svc
  namespace: prod
  labels: {app: payment-svc}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-svc}}
  template:
    metadata: {labels: {app: payment-svc}}
    spec:
      containers:
      - name: svc
        image: python:3.12-alpine@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
        command: ["python", "/srv/server.py"]
        env:
        - name: PAYMENT_API_TOKEN
          value: "eps_prod_9f83ka91mz"
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
        volumeMounts: [{name: code, mountPath: /srv}]
      volumes:
      - name: code
        configMap: {name: payment-svc-code}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-svc
  namespace: prod
spec:
  selector: {app: payment-svc}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-db-init
  namespace: prod
data:
  seed.sql: |
    CREATE TABLE transactions (
      id SERIAL PRIMARY KEY,
      merchant TEXT, amount_cents INT, status TEXT, created_at TIMESTAMPTZ DEFAULT now()
    );
    INSERT INTO transactions (merchant, amount_cents, status) VALUES
      ('shop-alpha', 4200, 'settled'),
      ('shop-beta', 1599, 'settled'),
      ('shop-gamma', 88000, 'pending'),
      ('shop-delta', 750, 'refunded');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-db
  namespace: prod
  labels: {app: payment-db}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-db}}
  template:
    metadata: {labels: {app: payment-db}}
    spec:
      containers:
      - name: db
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
        - name: POSTGRES_USER
          value: payments_rw
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: payment-db-credentials, key: password}
        - name: POSTGRES_DB
          value: payments
        ports: [{containerPort: 5432}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 300m, memory: 192Mi}
        volumeMounts:
        - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
      - name: init
        configMap: {name: payment-db-init}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-db
  namespace: prod
spec:
  selector: {app: payment-db}
  ports: [{port: 5432, targetPort: 5432}]
