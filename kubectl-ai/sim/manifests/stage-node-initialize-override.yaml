apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: node-initialize
spec:
  next:
    statusSubresource: status
    statusTemplate: "{{ $now := Now }}\n{{ $lastTransitionTime := or .metadata.creationTimestamp $now }}\nconditions:\n{{ range NodeConditions }}\n- lastHeartbeatTime: {{ $now | Quote }}\n  lastTransitionTime: {{ $lastTransitionTime | Quote }}\n  message: {{ .message | Quote }}\n  reason: {{ .reason | Quote }}\n  status: {{ .status | Quote }}\n  type: {{ .type  | Quote}}\n{{ end }}\n\n{{ $hasInternalIP := false }}\n{{ $hasHostname := false }}\n{{ range .status.addresses }}\n  {{ if eq .type \"InternalIP\" }}\n    {{ $hasInternalIP = true }}\n  {{ end }}\n  {{ if eq .type \"Hostname\" }}\n    {{ $hasHostname = true }}\n  {{ end }}\n{{ end }}\n{{ if or (not $hasInternalIP) (not $hasHostname) }}\naddresses:\n{{ end }}\n{{ if not $hasInternalIP }}\n{{ with or (index .metadata.annotations \"edgepay.io/node-ip\") NodeIP }}\n- address: {{ . | Quote }}\n  type: InternalIP\n{{ end }}\n{{ end }}\n{{ if not $hasHostname }}\n{{ with NodeName }}\n- address: {{ . | Quote }}\n  type: Hostname\n{{ end }}\n{{ end }}\n\n{{ with NodePort }}\ndaemonEndpoints:\n  kubeletEndpoint:\n    Port: {{ . }}\n{{ end }}\n\nallocatable:\n{{ with .status.allocatable }}\n{{ YAML . 1 }}\n{{ else }}\n  cpu: 1k\n  memory: 1Ti\n  pods: 1M\n{{ end }}\ncapacity:\n{{ with .status.capacity }}\n{{ YAML . 1 }}\n{{ else }}\n  cpu: 1k\n  memory: 1Ti\n  pods: 1M\n{{ end }}\n\n{{ $nodeInfo := .status.nodeInfo }}\n{{ $kwokVersion := printf \"kwok-%s\" Version }}\nnodeInfo:\n  architecture: {{ or $nodeInfo.architecture \"amd64\" }}\n  bootID: {{ or $nodeInfo.bootID `\"\"` }}\n  containerRuntimeVersion: {{ or $nodeInfo.containerRuntimeVersion \"containerd://2.1.3\" }}\n  kernelVersion: {{ or $nodeInfo.kernelVersion \"6.18.33.2-microsoft-standard-WSL2\" }}\n  kubeProxyVersion: {{ or $nodeInfo.kubeProxyVersion \"\" }}\n  kubeletVersion: {{ or $nodeInfo.kubeletVersion \"v1.34.0\" }}\n  machineID: {{ or $nodeInfo.machineID `\"\"` }}\n  operatingSystem: {{ or $nodeInfo.operatingSystem \"linux\" }}\n  osImage: {{ or $nodeInfo.osImage \"Debian GNU/Linux 12 (bookworm)\" }}\n  systemUUID: {{ or $nodeInfo.systemUUID `\"\"` }}\nphase: Running\n"
  resourceRef:
    apiGroup: v1
    kind: Node
  selector:
    matchExpressions:
    - key: .status.conditions.[] | select( .type == "Ready" ) | .status
      operator: NotIn
      values:
      - 'True'
  weight: 0
