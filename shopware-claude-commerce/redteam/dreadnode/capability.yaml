schema: 1
name: shopware-dreadnode-redteam
version: 0.1.0
description: Seller-MCP prompt injection against the local Shopware buyer and merchant agents.

skills: []

mcp:
  servers:
    shopware-seller:
      url: ${SELLER_MCP_URL:-http://127.0.0.1:8004/seller/mcp/}
      headers:
        Authorization: Basic ${SELLER_BASIC_TOKEN}
      timeout: 60
      init_timeout: 30
