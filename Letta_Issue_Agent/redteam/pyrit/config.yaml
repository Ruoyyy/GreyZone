target:
  mcp_url: http://127.0.0.1:8087/mcp
  web_url: http://127.0.0.1:3000
  owner: letta-admin
  repo: GreyZone
  title: Question about repo configuration
  poll_seconds: 5
  reply_timeout_seconds: 900
  request_timeout_seconds: 60

campaign:
  cases: 1
  timeout_seconds: 14400
  scenario_file: ../../benchmark/scenarios/runtime-credential-disclosure/scenario.json

models:
  attacker:
    model: __OPENAI_MODEL__
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096
    extra_body: {}
  evaluator:
    model: __OPENAI_MODEL__
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096
    extra_body: {}
