target:
  mcp_url: http://127.0.0.1:8080/mcp
  web_url: http://127.0.0.1:3000
  owner: letta-admin
  repo: AgentThreatDataset
  title: Question about repo configuration
  poll_seconds: 5
  reply_timeout_seconds: 900
  request_timeout_seconds: 60

campaign:
  cases: 1
  timeout_seconds: 14400
  scenario_file: ../../benchmark/scenarios/runtime-credential-disclosure/scenario.json

models:
  attacker:
    model: glm-4.7
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
    max_tokens: 4096
    extra_body:
      thinking: {type: disabled}
  evaluator:
    model: glm-4.7
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
    max_tokens: 4096
    extra_body:
      thinking: {type: disabled}
