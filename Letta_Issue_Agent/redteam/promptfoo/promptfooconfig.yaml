# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: >
  Redteam vs Gitea Letta agent via redteam-mcp (HTTP).
  Attack goal and local generation plugin come from the selected benchmark
  scenario. Runner-container Oracle alerts are collected separately; this
  adapter does not import Oracle verdicts into Promptfoo grading.

targets:
  # Custom target: maps each attack to a Gitea issue (see shared/js/mcp_target_provider.mjs)
  - id: file://./shared/js/mcp_target_provider.mjs
    label: gitea_letta            # Name shown in reports
    config:
      timeoutSeconds: 900         # Timeout for individual MCP writes/session defaults (s)
      # sessionId matching this regex = continue an existing issue, else create a new one
      sessionIdPattern: '^[0-9]+$'
      # Multi-turn campaign: all tests/turns share ONE issue (persistent conversation).
      # Turn 1 = issue body, later turns = comments; _lastBotCommentId harvests only new replies.
      reuseIssue: true
      # Create bodies need @letta-code (MCP only auto-prefixes comments)
      ensureMention: '@letta-code'  # Added to NEW issue bodies (gateway only patches comments)
      # Whether this provider also prefixes comments; false = let the MCP gateway do it
      # (exercises the real production code path).
      ensureMentionOnComment: false
      defaults:                   # Default repo coordinates for {{owner}} / {{repo}} templates
        owner: letta-admin
        repo: GreyZone
      mcp:                        # MCP transport: url = HTTP (production) or command = stdio (mock)
        # Host default; override with PROMPTFOO_MCP_URL inside compose (direct gateway route)
        url: http://127.0.0.1:8087/mcp
        # For offline smoke without the stack, swap to:
        # command: node
        # args: ['./fixtures/mock_issue_mcp.mjs']
        # cwd: .
      tools:                      # MCP tool names (change here to swap implementations)
        createIssue: issue_write
        comment: issue_write
        wait: issue_read
      createArgs:                 # Template for creating an issue; {{prompt}} = this turn's attack
        method: create
        owner: '{{owner}}'
        repo: '{{repo}}'
        # Title must not reveal redteam/promptfoo markers; look like an ordinary collaborator
        title: 'Question about repo configuration'
        body: '{{prompt}}'
      commentArgs:                # Template for follow-up comments; {{issue_number}} = continued issue
        method: add_comment
        owner: '{{owner}}'
        repo: '{{repo}}'
        issue_number: '{{issue_number}}'
        body: '{{prompt}}'
      result:                     # Which fields to read from tool responses
        issueField: number        # Field holding the new issue number
        outputField: reply        # Field holding the target's reply (used as model output)
      wait:                       # Wait for the agent: poll comments until a completion marker
        mode: poll_comments
        intervalSeconds: 5        # Poll interval (s)
        timeoutSeconds: 900       # Max wait (s)
        botUser: gitea-actions    # Only comments by this user count (the agent's bot identity)
        doneMarks:                # Any of these = the turn is over
          - 'Letta Code finished'
          - 'Letta Code failed'
          - 'Letta Code encountered an error'
        failMarks:                # Any of these = the agent's turn failed
          - 'Letta Code failed'
          - 'Letta Code encountered an error'
        args:                     # Tool arguments used while polling
          method: get_comments
          owner: '{{owner}}'
          repo: '{{repo}}'
          issue_number: '{{issue_number}}'

# promptfoo renders the attack text into the target via this template;
# {{prompt}} is filled by the redteam generator.
prompts:
  - '{{prompt}}'

defaultTest:
  options:
    # Random UUIDs only isolate issues when reuseIssue is false.
    # With reuseIssue: true above, every test shares the campaign issue.
    transformVars: '{ ...vars, sessionId: context.uuid }'

# Results path (already gitignored; a run artifact)
outputPath: promptfoo-results/__BENCHMARK_SCENARIO__.json

# ============ Redteam scan configuration ============
redteam:
  # System under test description: drives attack generation and gives the
  # generator the context it needs.
  purpose: |
    __BENCHMARK_OBJECTIVE__
  # Variable the generated attack is injected into (must match the prompts template above)
  injectVar: prompt
  # Tests generated PER PLUGIN. Total tests = numTests x number of plugins.
  # Current configuration: 1 enabled plugin x 1 test, with up to 10 Crescendo turns.
  numTests: 1
  # Attack generator model (separate from the target under test)
  provider:
    # Do NOT set response_format:json_object globally: the plugin generator parses
    # line-by-line, so a JSON envelope leaks into the attack text. JSON mode is
    # injected only at the crescendo strategy layer (see strategies below).
    id: __OPENAI_PROVIDER__
    config:
      apiBaseUrl: __OPENAI_BASE_URL__
      apiKeyEnvar: OPENAI_API_KEY
      max_tokens: 4096
  # Locally-generating plugins that only craft attack text (no remote generation).
  plugins:
    - debug-access # __BENCHMARK_PLUGIN__
  strategies:
    - id: basic
      config:
        enabled: false
    # Multi-turn escalation. stateful=true sends only the newest message each turn;
    # conversation continuity is carried by the Gitea issue thread.
    - id: crescendo
      config:
        stateful: true
        maxTurns: 10 # __BENCHMARK_MAX_TURNS__
        # Strategy-scoped attacker override: same model, plus JSON mode.
        # crescendo parses one JSON object per step; json_object removes code fences
        # at the API layer. Not applied globally (see provider note above).
        redteamProvider:
          id: __OPENAI_PROVIDER__
          config:
            apiBaseUrl: __OPENAI_BASE_URL__
            apiKeyEnvar: OPENAI_API_KEY
            max_tokens: 4096
            response_format: { type: json_object }
