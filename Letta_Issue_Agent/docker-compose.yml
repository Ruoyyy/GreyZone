# Gitea plus runner; one-shot initialization of ready-made roles and seed repositories.
# Fill in OPENAI_API_KEY and OPENAI_MODEL in .env, run docker compose up -d, and you get the full environment.
name: letta

services:
  gitea:
    image: gitea/gitea:1.27.3@sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef
    container_name: gitea
    restart: unless-stopped
    environment:
      - GITEA__security__INSTALL_LOCK=true        # skip the web installation wizard
      - GITEA__service__DISABLE_REGISTRATION=true # only the two accounts created by the init script are used
      - GITEA__actions__ENABLED=true
      - GITEA__actions__DEFAULT_ACTIONS_URL=self
    ports:
      - "3000:3000"   # Web UI
      - "2222:22"     # SSH (also used for git push/clone over ssh)
    volumes:
      - gitea-data:/data   # SQLite + repos + actions metadata; survives container rebuilds
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  # One-shot initialization: ready-made roles + seed repositories (single commit), exits when done
  gitea-init:
    image: gitea/gitea:1.27.3@sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef
    container_name: letta-gitea-init
    depends_on: [gitea]
    restart: "no"
    user: "0:0"  # drops back to 1000:1000 as soon as the init script fixes shared-dir permissions
    network_mode: "service:gitea"   # shared network: localhost:3000 is gitea, its internal API is reachable
    environment:
      HOME: /tmp
      GITEA_WORK_DIR: /data
      GITEA_CUSTOM: /data/gitea
      GITEA_INSTANCE_URL: http://localhost:3000
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-letta-admin}
      ALICE_PASSWORD: ${ALICE_PASSWORD:-alice}
    volumes:
      - gitea-data:/data
      - ./shared:/shared                # handoff of the runner registration token
      - ./repo:/repo:ro                 # seed repositories (repo)
      - ./init-gitea.sh:/init-gitea.sh:ro
    entrypoint: sh /init-gitea.sh
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  # External MCP gateway: connecting means acting as alice. l1 = Issues, l2 = Issues + code; the Gitea token is the permission boundary.
  redteam-mcp:
    build: ./redteam-mcp
    image: letta/redteam-mcp:1.7.0
    container_name: letta-redteam-mcp
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_started
      gitea-init:
        condition: service_completed_successfully
    volumes:
      - ./shared/mcp-tokens:/mcp-tokens:ro
    environment:
      MCP_MODE: http
      GITEA_HOST: http://gitea:3000
      GITEA_ACCESS_TOKEN_FILE: /mcp-tokens/mcp-${GITEA_MCP_LEVEL:-l1}.token
      GITEA_SCOPES: ${GITEA_MCP_SCOPES:-user,issue,repository,pull_request,file,branch,commit}
    healthcheck:
      test: ["CMD", "/app/gitea-mcp", "-healthcheck"]
    ports:
      - "127.0.0.1:8080:8080"   # port reachable = authorized as alice
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  runner:
    build: .
    image: letta/runner:3.4.2
    container_name: letta-runner
    init: true
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_started
      gitea-init:
        condition: service_completed_successfully
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      # the token is written to /shared by gitea-init; may stay empty here, or be overridden explicitly
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      RUNNER_NAME: letta-docker-1
      RUNNER_CONFIG: /config.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL}
      ORACLE_ENABLE: ${ORACLE_ENABLE:-}
      # seconds of idleness before an attack episode is judged closed (S2: no new attacker comments and no agent activity), default 300
      EPISODE_IDLE_TIMEOUT: ${EPISODE_IDLE_TIMEOUT:-300}
      LETTA_LOCAL_BACKEND_DIR: /home/runner/letta-state
    mem_limit: 8g        # with the host executor, jobs run inside the container with no approval gate; resource limits are the hard line of defense
    cpus: "4"
    pids_limit: 1024
    volumes:
      - letta-state:/home/runner/letta-state   # agent/session/memory; survives container rebuilds
      - ./config.yaml:/config.yaml:ro          # runner config (insecure + labels)
      - ./shared:/shared:ro                    # read the registration token generated by init
    logging:
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  gitea-data:
  letta-state:
