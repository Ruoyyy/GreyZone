# Placed at the target repo's .gitea/workflows/letta.yml (the Gitea Actions convention directory).
#
# Triggers (three entry points, all continuing the same conversation on the same issue, i.e. multi-turn chat):
#   1. an issue comment containing @letta-code
#   2. the issue being labeled letta-code
#   3. the issue body containing @letta-code
# Start a new topic: comment @letta-code [--new]
#
# Repo code: the first step git-clones into $GITHUB_WORKSPACE (act_runner already sets that
# variable); the letta process works in that directory. After changes, push using GITHUB_TOKEN
# as the remote credential (what actions/checkout does in GitHub mode; here a single git line
# handles it, with no dependency on any external action repo).
#
# LLM: direct Z.ai GLM connection (natively supported by letta; env vars verified against the 0.31.14 source)
#   ZAI_API_KEY is passed down into the runner container env (compose environment section), and the letta
#   process inherits it via process.env (run-letta.ts spawn env:{...process.env}); no secrets reference needed here.
#   Model: -m glm-5.3-flash in letta_args
#
# Action source: the local Gitea private repo letta-admin/letta-code-action, pinned to a fixed commit SHA.
# The action repo's Actions → General page has sharing enabled for repos under letta-admin.

name: Letta Code

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  letta:
    # Job-level filter: the runner is an exclusive resource and unrelated comments would hog it,
    # so they must be blocked at the job layer first
    # (the action also runs its own permission check: only collaborators with write access may trigger)
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@letta-code')) ||
      (github.event_name == 'issues' && github.event.label.name == 'letta-code') ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@letta-code'))
    runs-on: letta
    env:
      GIT_AUTHOR_NAME: letta-admin
      GIT_AUTHOR_EMAIL: letta-admin@gitea.com
      GIT_COMMITTER_NAME: letta-admin
      GIT_COMMITTER_EMAIL: letta-admin@gitea.com
    # Multiple triggers on the same issue run serially, without interrupting each other
    concurrency:
      group: letta-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write    # push branches
      issues: write      # comment / track conversations
      pull-requests: write  # open PRs
    steps:
      - name: Checkout
        shell: bash
        run: |
          git clone --depth=1 "http://oauth2:${GITHUB_TOKEN}@gitea:3000/${GITHUB_REPOSITORY}.git" "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config user.name "letta-admin"
          git config user.email "letta-admin@gitea.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-injected by Gitea, equivalent to GitHub

      - uses: http://gitea:3000/letta-admin/letta-code-action@__ACTION_SHA__
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bot_name: letta-admin
          bot_id: "1"
          allowed_non_write_users: alice
          # Use letta and bun preinstalled in the image, skipping per-job npm/bun downloads
          path_to_letta_executable: /usr/local/bin/letta
          path_to_bun_executable: /usr/local/bin/bun   # Alpine musl build, preinstalled by the Dockerfile
          label_trigger: letta-code
          # No Letta Cloud: local backend; agent/session/memory live in the in-container letta-state volume
          model: glm-5.3-flash
          letta_args: "--backend local"
          # Continue an independent session per conversation_id from the issue comment, on the same agent
          # agent_id left unspecified: the action auto-creates/reuses an agent by tag
          # (persona/memory attach to the auto-managed agent; state lives in the container volume and survives rebuilds)
          # validate-env requires at least one of base_url/api_key; the local backend never actually contacts
          # this placeholder address (verified in-container: both chat rounds succeeded, session persistence worked)
          letta_base_url: http://localhost:8283
