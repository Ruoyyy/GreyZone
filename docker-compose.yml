# Gitea 与 runner；一键初始化成品角色与成品仓库。
# 用户只需在 .env 填 ZAI_API_KEY，docker compose up -d 即得完整环境。
services:
  gitea:
    image: gitea/gitea:1
    container_name: gitea
    restart: unless-stopped
    environment:
      - GITEA__security__INSTALL_LOCK=true        # 跳过网页安装向导
      - GITEA__service__DISABLE_REGISTRATION=true # 仅用初始化脚本建的两个账号
      - GITEA__actions__ENABLED=true
      - GITEA__actions__DEFAULT_ACTIONS_URL=self
    ports:
      - "3000:3000"   # Web UI
      - "2222:22"     # SSH(git push/clone 走 ssh 也用这个)
    volumes:
      - gitea-data:/data   # SQLite + repo + actions 元数据,容器重建不丢
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  # 一次性初始化：成品角色 + 成品仓库（单提交），跑完退出
  gitea-init:
    image: gitea/gitea:1
    container_name: letta-gitea-init
    depends_on: [gitea]
    restart: "no"
    user: "1000:1000"
    network_mode: "service:gitea"   # 共享网络：localhost:3000 即 gitea，内部 API 可达
    environment:
      HOME: /tmp
      GITEA_WORK_DIR: /data
      GITEA_CUSTOM: /data/gitea
      GITEA_INSTANCE_URL: http://localhost:3000
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-letta-admin}
      RUYOU_PASSWORD: ${RUYOU_PASSWORD:-ruoyu}
    volumes:
      - gitea-data:/data
      - ./shared:/shared                # runner 注册 token 交接
      - ./repo:/repo:ro                 # 成品仓库种子(repo)
      - ./init-gitea.sh:/init-gitea.sh:ro
    entrypoint: sh /init-gitea.sh
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  runner:
    build: .
    image: letta/runner
    container_name: letta-runner
    init: true
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_started
      gitea-init:
        condition: service_completed_successfully
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      # token 由 gitea-init 写入 /shared，此处可留空；也可显式覆盖
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      RUNNER_NAME: letta-docker-1
      RUNNER_CONFIG: /config.yaml
      ZAI_API_KEY: ${ZAI_API_KEY}
      ORACLE_ENABLE: ${ORACLE_ENABLE:-}
      LETTA_LOCAL_BACKEND_DIR: /home/runner/letta-state
    mem_limit: 8g        # host 执行器下 job 在容器内跑,无审批闸门,资源限额是硬防线
    cpus: "4"
    pids_limit: 1024
    volumes:
      - letta-state:/home/runner/letta-state   # agent/会话/记忆,容器重建不丢
      - ./config.yaml:/config.yaml:ro          # runner 配置(insecure + labels)
      - ./shared:/shared:ro                    # 读取初始化生成的注册 token
    logging:
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  gitea-data:
  letta-state:
