name: hga-sim

services:
  homeassistant:
    build:
      context: .
      additional_contexts:
        hga: ../hga
    image: hga-sim/homeassistant:2026.10.1
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config:/config
      - ../hga/custom_components/home_generative_agent:/config/custom_components/home_generative_agent:ro
    # Share pgvector's network namespace so HGA's Basic setup default
    # (localhost:5432) reaches the database.
    network_mode: "service:pgvector"
    depends_on:
      pgvector:
        condition: service_healthy

  # Fake vision model (Ollama API) for Camera Image Analysis: replies with the
  # text in mock-vlm/caption.txt. HA reaches it at http://localhost:11500.
  mock-vlm:
    image: hga-sim/homeassistant:2026.10.1
    restart: unless-stopped
    entrypoint: ["python3", "-u", "/app/server.py"]
    volumes:
      - ./mock-vlm:/app:ro
      - ./images:/images:ro
    network_mode: "service:pgvector"
    depends_on:
      - pgvector

  # Simulated LAN device (DLNA media renderer announcing itself over SSDP).
  # Off by default: `docker compose up -d mock-device` = the device appears on
  # the network; `docker compose stop mock-device` = it leaves.
  mock-device:
    image: hga-sim/homeassistant:2026.10.1
    profiles: ["device"]
    entrypoint: ["python3", "-u", "/app/ssdp_device.py"]
    volumes:
      - ./mock-device:/app:ro
    network_mode: "service:pgvector"
    depends_on:
      - pgvector

  # HA reaches it at localhost:5432 (shared namespace). Only HA's 8123 is published.
  pgvector:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: admin_db
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d admin_db"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
