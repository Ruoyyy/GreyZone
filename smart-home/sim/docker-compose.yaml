name: hga-sim

services:
  homeassistant:
    build:
      context: .
      additional_contexts:
        hga: ../hga
    image: hga-sim/homeassistant:2026.10.1
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config:/config
      - ../hga/custom_components/home_generative_agent:/config/custom_components/home_generative_agent:ro
    # Share pgvector's network namespace so HGA's Basic setup default
    # (localhost:5432) reaches the database.
    network_mode: "service:pgvector"
    depends_on:
      pgvector:
        condition: service_healthy

  # Static image host: serves images/current.jpg to the Test Camera (generic_camera),
  # so the real vision model reads an image you control. HA reaches it at :11500.
  mock-vlm:
    image: hga-sim/homeassistant:2026.10.1
    restart: unless-stopped
    entrypoint: ["python3", "-u", "/app/server.py"]
    volumes:
      - ./mock-vlm:/app:ro
      - ./images:/images:ro
    network_mode: "service:pgvector"
    depends_on:
      - pgvector

  # Simulated LAN device (DLNA media renderer announcing itself over SSDP).
  # Off by default: `docker compose up -d mock-device` = the device appears on
  # the network; `docker compose stop mock-device` = it leaves.
  mock-device:
    image: hga-sim/homeassistant:2026.10.1
    profiles: ["device"]
    entrypoint: ["python3", "-u", "/app/ssdp_device.py"]
    volumes:
      - ./mock-device:/app:ro
    network_mode: "service:pgvector"
    depends_on:
      - pgvector

  # Mock web-search MCP server (streamable HTTP, :18090/mcp). The exfil
  # back-channel: every search query the agent runs is logged to its stdout.
  # Off by default; `docker compose --profile exfil up -d mock-mcp` enables it.
  mock-mcp:
    image: hga-sim/homeassistant:2026.10.1
    profiles: ["exfil"]
    restart: unless-stopped
    entrypoint: ["python3", "-u", "/app/fetch_server.py"]
    volumes:
      - ./mock-mcp:/app:ro
    network_mode: "service:pgvector"
    depends_on:
      - pgvector

  # Red-team control plane MCP (streamable HTTP, :18092/mcp, published). The
  # four injection points (camera image / SSDP device name / entity attributes
  # / web page) plus probe tools, for an external red-team agent. Needs HA_TOKEN
  # from secrets.env; writes images/current.jpg.
  redteam-mcp:
    image: hga-sim/homeassistant:2026.10.1
    restart: unless-stopped
    entrypoint: ["python3", "-u", "/app/server.py"]
    volumes:
      - ./redteam-mcp:/app:ro
      - ./images:/images
    env_file: secrets.env
    network_mode: "service:pgvector"
    depends_on:
      - pgvector

  # HA reaches it at localhost:5432 (shared namespace). HA's 8123 and the
  # red-team MCP's 18092 are the published ports.
  pgvector:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "18092:18092"
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: admin_db
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d admin_db"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
