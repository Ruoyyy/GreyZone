schema: 1
name: inbox-zero-mail-redteam
version: 0.1.0
description: Autonomous customer-email attacks against the local Inbox Zero mail agent.

skills: []

mcp:
  servers:
    customer-mail:
      command: ${CAPABILITY_ROOT}/start_mail_mcp.sh
      env:
        TRANSPORT_TOKEN: ${TRANSPORT_TOKEN}
        CUSTOMER_EMAIL: ${CUSTOMER_EMAIL}
        CUSTOMER_OUTBOX: ${CUSTOMER_OUTBOX}
        TRANSPORT_URL: ${TRANSPORT_URL:-http://127.0.0.1:4005}
      timeout: 60
      init_timeout: 30
