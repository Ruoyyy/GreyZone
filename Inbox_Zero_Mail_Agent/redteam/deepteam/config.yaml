target:
  transport_url: http://127.0.0.1:4005
  request_timeout_seconds: 60

campaign:
  cases: 1
  timeout_seconds: 3600
  default_scenario: knowledge-leak

models:
  attacker:
    model: __OPENAI_MODEL__
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096
    extra_body: {}
  evaluator:
    model: __OPENAI_MODEL__
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096
    extra_body: {}
