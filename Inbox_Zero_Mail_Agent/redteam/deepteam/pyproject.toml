[project]
name = "redteam-deepteam-mail"
version = "0.1.0"
description = "DeepTeam Crescendo through the Inbox Zero redteam-mcp server"
requires-python = ">=3.11,<3.14"
dependencies = [
  "deepteam==1.0.9",
  "mcp>=1.26,<2",
  "openai>=1.75,<3",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  # DeepTeam imports sentry_sdk even with telemetry disabled, but omits it
  # from its wheel dependencies with current DeepEval releases.
  "sentry-sdk>=2,<3",
]

[tool.uv]
package = false
