schema: 1
name: commonly-dreadnode-redteam
version: 0.1.0
description: Bounded alice-to-Scout attacks in the Commonly local lab.
skills: []
mcp:
  servers:
    commonly-attacker:
      command: ${CAPABILITY_ROOT}/start_mcp.sh
      env:
        COMMONLY_STATE_FILE: ${COMMONLY_STATE_FILE}
        COMMONLY_PYTHON: ${COMMONLY_PYTHON}
        ORACLE_BASE_URL: ${ORACLE_BASE_URL}
        ORACLE_ENABLE: ${ORACLE_ENABLE}
      timeout: 1900
      init_timeout: 30
